# Label Studio 本體（預設）：nginx + app（SQLite + 容器內嵌 Redis），建置不含 PyTorch/YOLO
# 啟動：docker compose up --build -d
# 部署模型至 Triton：需 YOLO 依賴 → docker compose -f docker-compose.full.yml up --build -d
# 含 RQ worker：docker compose --profile worker up --build -d
# 完整堆疊（PostgreSQL + YOLO/RQ + Triton + Train Server）：docker compose -f docker-compose.full.yml up --build -d

services:
  nginx:
    build:
      context: .
      args:
        INCLUDE_YOLO_TRAINING: ${INCLUDE_YOLO_TRAINING:-false}
    image: custom_labelstudio:latest
    restart: unless-stopped
    ports:
      - "8080:8085"
      - "8081:8086"
    depends_on:
      - app
    environment:
      - LABEL_STUDIO_HOST=${LABEL_STUDIO_HOST:-}
    volumes:
      - ./data:/label-studio/data:rw
      - ./deploy/nginx/certs:/certs:ro
    command: nginx

  app:
    stdin_open: true
    tty: true
    build:
      context: .
      args:
        INCLUDE_YOLO_TRAINING: ${INCLUDE_YOLO_TRAINING:-false}
    image: custom_labelstudio:latest
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - path: .env
        required: false
    environment:
      - JSON_LOG=1
      - HOME=/label-studio
      - USER=labelstudio
      - LOGNAME=labelstudio
      - TORCHINDUCTOR_CACHE_DIR=/label-studio/data/.cache/torchinductor
      # Docker 使用映像內 production build，覆寫 .env 的 FRONTEND_HMR=true（本機 dev 用）
      - FRONTEND_HMR=false
      # 區網存取請在 .env 設 LABEL_STUDIO_HOST=http://<本機IP>:8080（須與瀏覽器網址一致）
      - LABEL_STUDIO_HOST=${LABEL_STUDIO_HOST:-}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-}
      # 預設 SQLite（資料在 ./data）；要用外部 PostgreSQL 請設 DJANGO_DB=default 與 POSTGRE_*
      - DJANGO_DB=${DJANGO_DB:-sqlite}
      - POSTGRE_NAME=${POSTGRE_NAME:-}
      - POSTGRE_USER=${POSTGRE_USER:-}
      - POSTGRE_PASSWORD=${POSTGRE_PASSWORD:-}
      - POSTGRE_PORT=${POSTGRE_PORT:-5432}
      - POSTGRE_HOST=${POSTGRE_HOST:-}
      # 未設外部 Redis 時，容器內嵌 Redis（127.0.0.1:6379）
      - EMBEDDED_REDIS=${EMBEDDED_REDIS:-1}
      - REDIS_ENABLED=${REDIS_ENABLED:-1}
      - REDIS_HOST=${REDIS_HOST:-}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_URL=${REDIS_URL:-}
      - RQ_REDIS_HOST=${RQ_REDIS_HOST:-}
      - RQ_REDIS_PORT=${RQ_REDIS_PORT:-6379}
      - RQ_REDIS_DB=${RQ_REDIS_DB:-0}
      - RQ_REDIS_URL=${RQ_REDIS_URL:-}
      - TRITON_SERVER_URL=${TRITON_SERVER_URL:-}
      - TRITON_MODEL_REPOSITORY=${TRITON_MODEL_REPOSITORY:-/label-studio/data/triton_models}
      - TRAIN_SERVER_URL=${TRAIN_SERVER_URL:-}
      - TRAIN_SERVER_API_KEY=${TRAIN_SERVER_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/label-studio/data:rw
    command: label-studio-uwsgi

  rqworker:
    profiles:
      - worker
    build:
      context: .
      args:
        INCLUDE_YOLO_TRAINING: ${INCLUDE_YOLO_TRAINING:-false}
    image: custom_labelstudio:latest
    restart: unless-stopped
    environment:
      - JSON_LOG=1
      - DJANGO_DB=${DJANGO_DB:-sqlite}
      - POSTGRE_NAME=${POSTGRE_NAME:-}
      - POSTGRE_USER=${POSTGRE_USER:-}
      - POSTGRE_PASSWORD=${POSTGRE_PASSWORD:-}
      - POSTGRE_PORT=${POSTGRE_PORT:-5432}
      - POSTGRE_HOST=${POSTGRE_HOST:-}
      - EMBEDDED_REDIS=${EMBEDDED_REDIS:-1}
      - REDIS_ENABLED=${REDIS_ENABLED:-1}
      - REDIS_HOST=${REDIS_HOST:-}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_URL=${REDIS_URL:-}
      - RQ_REDIS_HOST=${RQ_REDIS_HOST:-}
      - RQ_REDIS_PORT=${RQ_REDIS_PORT:-6379}
      - RQ_REDIS_DB=${RQ_REDIS_DB:-0}
      - RQ_REDIS_URL=${RQ_REDIS_URL:-}
      - TRITON_SERVER_URL=${TRITON_SERVER_URL:-}
      - TRITON_MODEL_REPOSITORY=${TRITON_MODEL_REPOSITORY:-/label-studio/data/triton_models}
      - TRAIN_SERVER_URL=${TRAIN_SERVER_URL:-}
      - TRAIN_SERVER_API_KEY=${TRAIN_SERVER_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/label-studio/data:rw
    command: python label_studio/manage.py rqworker low --worker-class rq.worker.SimpleWorker
