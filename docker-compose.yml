services:
  nginx:
    build: .
    image: custom_labelstudio:latest
    restart: unless-stopped
    ports:
      - "8080:8085"
      - "8081:8086"
    depends_on:
      - app
    environment:
      - LABEL_STUDIO_HOST=${LABEL_STUDIO_HOST:-}
    #   Optional: Set nginx error log level (default: warn)
    #   Use 'warn' or higher to reduce noisy "client closed keepalive connection" messages
    #      - NGINX_ERROR_LOG_LEVEL=warn
    #   Optional: Specify SSL termination certificate & key
    #   Just drop your cert.pem and cert.key into folder 'deploy/nginx/certs'
    #      - NGINX_SSL_CERT=/certs/cert.pem
    #      - NGINX_SSL_CERT_KEY=/certs/cert.key
    volumes:
      - ./data:/label-studio/data:rw
      - ./deploy/nginx/certs:/certs:ro
    #   Optional: Override nginx default conf
    #      - ./deploy/my.conf:/etc/nginx/nginx.conf
    command: nginx

  app:
    stdin_open: true
    tty: true
    build: .
    image: custom_labelstudio:latest
    restart: unless-stopped
    expose:
      - "8000"
    depends_on:
      - db
      - redis
      - triton
      - train-server
    environment:
      - DJANGO_DB=default
      - POSTGRE_NAME=postgres
      - POSTGRE_USER=postgres
      - POSTGRE_PASSWORD=
      - POSTGRE_PORT=5432
      - POSTGRE_HOST=db
      - LABEL_STUDIO_HOST=${LABEL_STUDIO_HOST:-}
      - JSON_LOG=1
      # Redis（可選）：若你有啟用背景任務/快取，通常會用到這些設定
      # 注意：Label Studio Community 版是否實際啟用 Redis，取決於你目前這個分支的後端設定
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_URL=redis://redis:6379/0
      - REDIS_ENABLED=1
      - RQ_REDIS_HOST=redis
      - RQ_REDIS_PORT=6379
      - RQ_REDIS_DB=0
      # 與同 compose 內的 triton 服務通訊（勿用 localhost，那是容器自己）
      # triton 容器內部監聽 8000，主機對外才是 18000（ports: "18000:8000"）
      - TRITON_SERVER_URL=http://triton:8000
      - TRITON_MODEL_REPOSITORY=/label-studio/data/triton_models
      # 獨立 YOLO Train Server（compose 內 train-server:8011；未設定則走本機 RQ）
      - TRAIN_SERVER_URL=${TRAIN_SERVER_URL:-http://train-server:8011}
      - TRAIN_SERVER_API_KEY=${TRAIN_SERVER_API_KEY:-}
    #      - LOG_LEVEL=DEBUG
    volumes:
      - ./data:/label-studio/data:rw
    command: label-studio-uwsgi

  rqworker:
    build: .
    image: custom_labelstudio:latest
    restart: unless-stopped
    depends_on:
      - db
      - redis
      - triton
      - train-server
    environment:
      - DJANGO_DB=default
      - POSTGRE_NAME=postgres
      - POSTGRE_USER=postgres
      - POSTGRE_PASSWORD=
      - POSTGRE_PORT=5432
      - POSTGRE_HOST=db
      - JSON_LOG=1
      - REDIS_ENABLED=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_URL=redis://redis:6379/0
      - RQ_REDIS_HOST=redis
      - RQ_REDIS_PORT=6379
      - RQ_REDIS_DB=0
      # triton 容器內部監聽 8000，主機對外才是 18000（ports: "18000:8000"）
      - TRITON_SERVER_URL=http://triton:8000
      - TRITON_MODEL_REPOSITORY=/label-studio/data/triton_models
      # 獨立 YOLO Train Server（compose 內 train-server:8011；未設定則走本機 RQ）
      - TRAIN_SERVER_URL=${TRAIN_SERVER_URL:-http://train-server:8011}
      - TRAIN_SERVER_API_KEY=${TRAIN_SERVER_API_KEY:-}
    volumes:
      - ./data:/label-studio/data:rw
    command: python label_studio/manage.py rqworker low --worker-class rq.worker.SimpleWorker

  triton:
    image: nvcr.io/nvidia/tritonserver:24.01-py3
    hostname: triton
    restart: unless-stopped
    ports:
      - "18000:8000"
      - "18001:8001"
      - "18002:8002"
    volumes:
      - ./data/triton_models:/models
    command: tritonserver --model-repository=/models
    # GPU：取消下行註解並安裝 NVIDIA Container Toolkit
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  db:
    image: pgautoupgrade/pgautoupgrade:17-alpine
    hostname: db
    restart: unless-stopped
    # Optional: Enable TLS on PostgreSQL
    # Just drop your server.crt and server.key into folder 'deploy/pgsql/certs'
    # NOTE: Both files must have permissions u=rw (0600) or less
    #    command: >
    #      -c ssl=on
    #      -c ssl_cert_file=/var/lib/postgresql/certs/server.crt
    #      -c ssl_key_file=/var/lib/postgresql/certs/server.key
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
      - POSTGRES_USER=postgres
    volumes:
      - ${POSTGRES_DATA_DIR:-./postgres-data}:/var/lib/postgresql/data
      - ./deploy/pgsql/certs:/var/lib/postgresql/certs:ro

  redis:
    image: redis:7-alpine
    hostname: redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  train-server:
    build:
      context: .
      dockerfile: Dockerfile.train-server
    image: labelstudio-train-server:latest
    hostname: train-server
    restart: unless-stopped
    ports:
      - "8011:8011"
    environment:
      - TRAIN_SERVER_HOST=0.0.0.0
      - TRAIN_SERVER_PORT=8011
      - TRAIN_SERVER_OUTPUT_ROOT=/data/training/models/trained
      - TRAIN_SERVER_MODELS_DIR=/data/training/models/original
      - TRAIN_SERVER_MAX_WORKERS=1
      - TRAIN_SERVER_DATALOADER_WORKERS=0
      - TRAIN_SERVER_API_KEY=${TRAIN_SERVER_API_KEY:-}
    volumes:
      - ./data:/data:rw
    # GPU：取消下行註解並安裝 NVIDIA Container Toolkit
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]


volumes:
  redis-data:
